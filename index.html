<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Factory Operating System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 p-6 min-h-screen text-slate-800">

  <!-- Header Navigation -->
  <header class="bg-white border border-slate-200 shadow-sm rounded-2xl px-6 py-3 flex flex-wrap items-center justify-between mb-6 gap-4">
    <div class="flex items-center space-x-3 font-bold text-slate-700">
      <span class="text-sky-500 text-xl">🏭</span>
      <span class="text-base tracking-tight">Smart Factory Operating System</span>
    </div>
    
    <nav class="flex items-center space-x-2" id="navTabs">
      <button data-tab="ftr" class="nav-tab bg-sky-500 text-white px-4 py-1.5 rounded-xl font-medium text-xs transition">FTR</button>
      <button data-tab="scrap" class="nav-tab text-slate-600 hover:bg-slate-100 px-4 py-1.5 rounded-xl text-xs font-medium transition">Scrap Metal</button>
      <button data-tab="loss" class="nav-tab text-slate-600 hover:bg-slate-100 px-4 py-1.5 rounded-xl text-xs font-medium transition">Production Loss</button>
    </nav>
  </header>

  <!-- Control Bar -->
  <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-wrap items-center justify-between gap-4 mb-6">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 text-xs font-semibold text-slate-600">
        <span>Select Date:</span>
        <input type="date" id="datePicker" class="border border-slate-300 rounded-lg px-3 py-1 text-xs" />
      </div>
      <div class="flex items-center gap-2 text-xs font-semibold text-slate-600">
        <span>Shift:</span>
        <select id="shiftFilter" class="border border-slate-300 rounded-lg px-2 py-1 text-xs">
          <option value="all">All Shifts</option>
          <option value="day">Day Shift</option>
          <option value="night">Night Shift</option>
        </select>
      </div>
    </div>
  </div>

  <!-- TAB 1: FTR -->
  <main id="tab-ftr" class="tab-content space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border text-center">
        <div class="text-xs text-slate-500 font-bold uppercase">Total Output</div>
        <div id="kpiTotalOutput" class="text-3xl font-extrabold text-slate-800 my-2">0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border text-center">
        <div class="text-xs text-slate-500 font-bold uppercase">Total Defects</div>
        <div id="kpiTotalDefects" class="text-3xl font-extrabold text-red-500 my-2">0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border text-center">
        <div class="text-xs text-slate-500 font-bold uppercase">Total Scrap</div>
        <div id="kpiTotalScrap" class="text-3xl font-extrabold text-slate-800 my-2">0</div>
      </div>
    </div>
  </main>

  <!-- TAB 2: SCRAP -->
  <main id="tab-scrap" class="tab-content hidden space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-4">📋 บันทึกข้อมูล Scrap ใหม่</h2>
      <form id="scrapForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
        <div>
          <label class="block font-semibold mb-1">Model</label>
          <input type="text" id="scrapModel" required class="w-full border p-2 rounded-lg" placeholder="เช่น TM19" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Q'ty</label>
          <input type="number" id="scrapQty" min="1" value="1" required class="w-full border p-2 rounded-lg" />
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg hover:bg-emerald-700">บันทึก</button>
        </div>
      </form>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-100 text-slate-700">
          <tr>
            <th class="p-3 border-b">Model</th>
            <th class="p-3 border-b">Quantity</th>
            <th class="p-3 border-b">Action</th>
          </tr>
        </thead>
        <tbody id="scrapTableBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>

  <!-- TAB 3: LOSS -->
  <main id="tab-loss" class="tab-content hidden space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
      <h2 class="text-sm font-bold text-slate-800">Production Loss Analytics</h2>
      <p class="text-xs text-slate-500 mt-2">ระบบกำลังประมวลผลข้อมูล Production Loss...</p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Set Default Date
      const dateInput = document.getElementById('datePicker');
      if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];

      // Tab Switcher
      const tabs = document.querySelectorAll('.nav-tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
          tabs.forEach(t => t.className = 'nav-tab text-slate-600 hover:bg-slate-100 px-4 py-1.5 rounded-xl text-xs font-medium transition');
          e.target.className = 'nav-tab bg-sky-500 text-white px-4 py-1.5 rounded-xl text-xs font-medium transition';

          const targetTab = e.target.getAttribute('data-tab');
          document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
          
          const activeContent = document.getElementById(`tab-${targetTab}`);
          if (activeContent) activeContent.classList.remove('hidden');
        });
      });

      // Simple LocalStorage Logic for Scrap Form
      const scrapForm = document.getElementById('scrapForm');
      const scrapTableBody = document.getElementById('scrapTableBody');

      function loadScrapData() {
        const data = JSON.parse(localStorage.getItem('simple_scrap') || '[]');
        scrapTableBody.innerHTML = data.map((item, idx) => `
          <tr>
            <td class="p-3">${item.model}</td>
            <td class="p-3 font-bold">${item.qty}</td>
            <td class="p-3"><button onclick="deleteItem(${idx})" class="text-red-500 font-bold">ลบ</button></td>
          </tr>
        `).join('');
      }

      window.deleteItem = function(index) {
        let data = JSON.parse(localStorage.getItem('simple_scrap') || '[]');
        data.splice(index, 1);
        localStorage.setItem('simple_scrap', JSON.stringify(data));
        loadScrapData();
      };

      if (scrapForm) {
        scrapForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const model = document.getElementById('scrapModel').value;
          const qty = document.getElementById('scrapQty').value;

          let data = JSON.parse(localStorage.getItem('simple_scrap') || '[]');
          data.push({ model, qty });
          localStorage.setItem('simple_scrap', JSON.stringify(data));
          
          scrapForm.reset();
          loadScrapData();
        });
      }

      loadScrapData();
    });
  </script>
</body>
</html>
